[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glims_ingest_tools"
version = "0.1.0"
description = "A set of utilities for preparing GLIMS data for ingest to GLIMS DB"
readme = "README.md"
authors = [
    {name = "Andrew Barrett", email = "andypbarrett@gmail.com"}
]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
#    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0"
]

#[project.urls]
#Homepage = "https://github.com/yourusername/my-project"
#Repository = "https://github.com/yourusername/my-project"
#Issues = "https://github.com/yourusername/my-project/issues"

#[tool.setuptools.packages.find]
#where = []

[tool.setuptools.package-dir]
"glims_ingest_tools" = "src"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true